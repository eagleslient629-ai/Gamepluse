name: Refresh news
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 9:00 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - run: |
          git config user.name "gampluse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "Daily news refresh" && git push)
